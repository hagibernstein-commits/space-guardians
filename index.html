function damage(){if(!game||game.inv>0)return;game.hp--;game.inv=1.6;tone(170,.15);$('#toast').textContent='המגן ספג פגיעה. נסו לזוז הצידה!';if(game.hp<=0){game.hp=3;game.rocks=[];game.enemies=[];pause=true;dialog('תחנת תיקון 🛠️','המגן נטען מחדש. מה שלמדתם נשאר איתכם! אפשר להמשיך בלי לאבד התקדמות.',[{label:'חוזרים לטיסה',fn:()=>{pause=false;modal.innerHTML=''}}])}}
function pulse(){if(!game||pause||questionOpen||game.cool>0)return;game.cool=.4;let target=game.enemies.filter(e=>e.y<game.py).sort((a,b)=>Math.abs(a.x-game.px)-Math.abs(b.x-game.px))[0];let px=target?target.x:game.px;game.shots.push({x:px,y:game.py-20});tone(420,.1,'triangle');if(game.charge>=5){game.charge-=5;game.enemies.forEach(a=>burst(a.x,a.y,'#8be6e0'));game.enemies=[];game.rocks=[];$('#toast').textContent='פעימת מדע גדולה! הנתיב התפנה ✦'}}
document.addEventListener('keydown',e=>{if(view!=='flight'||!game)return;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')game.left=true;if(e.key==='ArrowRight')game.right=true;if(e.key==='ArrowUp')game.py=Math.max(game.h*.34,game.py-20);if(e.key==='ArrowDown')game.py=Math.min(game.h-28,game.py+20);if(e.key===' ')pulse()});document.addEventListener('keyup',e=>{if(!game)return;if(e.key==='ArrowLeft')game.left=false;if(e.key==='ArrowRight')game.right=false});window.addEventListener('blur',()=>{if(game){game.left=false;game.right=false}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&game&&!questionOpen){pause=true;dialog('הטיסה מחכה לכם','עברתם למסך אחר. עצרנו את הטיסה.',[{label:'ממשיכים',fn:()=>{pause=false;modal.innerHTML=''}}])}});
function quiz(q,after,review=false){questionOpen=true;let wrong=0;let options=q[1].map((o,i)=>({o,i})).sort(()=>Math.random()-.5);modal.innerHTML=`<div class="overlay"><section class="dialog" role="dialog" aria-modal="true"><div class="eyebrow">${review?'בודקים מה באמת הבנו':'המגן של הרובוט נפתח בעזרת ידע'}</div><h2>${q[0]}</h2><button class="icon" id="hearQ">🔊 לשמוע את השאלה</button><div class="choices">${options.map(({o,i})=>`<button class="choice" data-answer="${i}"><span class="emoji">${o[0]}</span><span>${o[1]}</span></button>`).join('')}</div><p id="feedback" aria-live="polite">אפשר לחשוב בנחת. אין הגבלת זמן.</p><button class="primary wide hidden" id="qNext" style="margin-top:14px">${review?'ממשיכים ←':'שולחים פעימת מדע ✦'}</button></section></div>`;speak(q[0]);$('#hearQ').onclick=()=>speak(q[0]+' '+options.map(({o})=>o[1]).join('. '));modal.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(b.disabled)return;const i=+b.dataset.answer;if(i!==q[2]){wrong++;session.wrong++;b.classList.add('wrong');b.disabled=true;$('#feedback').textContent='עוד לא. '+q[3]+' נסו שוב.';tone(220,.12);speak('עוד לא. '+q[3]);return}session.answered++;if(!wrong)session.first++;b.classList.add('correct');modal.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);$('#feedback').textContent='בדיוק! '+q[3];tone(880,.2);$('#qNext').classList.remove('hidden');$('#qNext').onclick=()=>{modal.innerHTML='';after()}})}
function finalReview(){let rs=game?game.rSet:pick(D[mission].qReview.length,2);game=null;cancelAnimationFrame(anim);view='review';app.innerHTML=`<div class="screen"><div class="card"><div class="badge">🛰️</div><h2>המשימה כמעט הושלמה!</h2><p>הרובוט כבר מבין. עכשיו נבדוק אם נוכל להשתמש בידע גם במצב חדש.</p></div></div>`;quiz(D[mission].qReview[rs[0]],()=>quiz(D[mission].qReview[rs[1]],finish,true),true)}
function finish(){stop();view='finish';save.done[mission]=true;delete save.progress;let old=save.records[mission];save.records[mission]={first:Math.max(old?.first||0,session.first),lastFirst:session.first,wrong:session.wrong,attempts:(old?.attempts||0)+1};persist();let d=D[mission],all=Object.keys(save.done).length===D.length;app.innerHTML=`<div class="screen"><div class="card" style="text-align:center"><div class="badge">${d.icon} ✦</div><div class="eyebrow">תג חוקר החלל הוענק!</div><h2>${all?'השלמתם את מסע מערכת השמש!':'הצלתם את '+d.enemy+'!'}</h2><p>עניתם נכון על כל חמש השאלות, עם הסברים כשצריך.</p><div class="row"><span class="pill">${session.first} מתוך 5 בניסיון ראשון</span></div><p style="font-size:16px">${d.learn[0][1]}</p><div class="row"><button class="primary" id="advance">${mission<D.length-1?'ליעד הבא 🚀':'חזרה למפת המסע'}</button><button class="secondary" id="again">עוד סיבוב</button></div></div></div>`;$('#advance').onclick=()=>mission<D.length-1?start(mission+1):map();$('#again').onclick=()=>start(mission);confetti(all?60:26);chord(all?880:660)}
function dialog(title,body,buttons){modal.innerHTML=`<div class="overlay"><section class="dialog" role="dialog" aria-modal="true"><h2>${title}</h2><p>${body}</p><div class="row">${buttons.map((b,i)=>`<button class="${i===0?'primary':'secondary'}" data-dialog="${i}">${b.label}</button>`).join('')}</div></section></div>`;buttons.forEach((b,i)=>modal.querySelector(`[data-dialog="${i}"]`).onclick=b.fn)}
function showInfo(t,b){dialog(t,b,[{label:'הבנתי',fn:()=>modal.innerHTML=''}])}
function parents(){stop();view='parents';app.innerHTML=`<div class="screen"><div class="card"><div class="eyebrow">מבט להורים</div><h2>מה הילד באמת הבין?</h2><p style="font-size:16px">כל משימה כוללת 3 תגליות, הדגמה אינטראקטיבית ו-5 שאלות. אפשר לצאת מהמשימה באמצע ולחזור - ההתקדמות נשמרת וממשיכים מאותה נקודה. תג מתקבל רק אחרי שכל 5 השאלות נענו נכון, גם אם נדרשו רמזים. תשובה ראשונה מודדת הבנה לפני עזרה, לא רק השלמה.</p><div class="report">${D.map((d,i)=>{const r=save.records[i];return `<div class="reportItem"><strong>${d.icon} ${d.name}: ${save.done[i]?'הושלם':'עוד לא הושלם'}</strong><span class="small">${r?`בסיבוב האחרון: ${r.lastFirst}/5 בניסיון ראשון • ${r.wrong} ניסיונות תיקון<br>הכי טוב: ${r.first}/5 • סיבובים: ${r.attempts}`:'אין עדיין תוצאות.'}</span></div>`}).join('')}</div><p style="font-size:16px">כדאי לשאול: "מה יקרה לאותה קפיצה בירח? למה?" או "למה אצלנו לילה ובמקום אחר יום?" בקשו הסבר במילים שלו.</p><div class="row"><button class="secondary" id="sources">מקורות המדע</button><button class="secondary" id="back">חזרה למפה</button></div><button class="secondary wide" style="border-color:#d58b9e;color:#ffbdca" id="reset">איפוס כל ההתקדמות במכשיר הזה</button><div class="foot">אין חשבון ואין איסוף מידע. הקול העברי משתמש בקולות המותקנים בדפדפן, אם זמינים; לכל הסבר יש גם טקסט והדגמה. ניתן להשתיק בכל עת. גדלים ומרחקים אינם בקנה מידה.</div></div></div>`;$('#back').onclick=map;$('#sources').onclick=sources;$('#reset').onclick=()=>dialog('לאפס את המסע?','כל התגים והתוצאות בדפדפן הזה יימחקו. אי אפשר לבטל.',[{label:'לא, משאירים',fn:()=>modal.innerHTML=''}, {label:'כן, לאפס הכל',fn:()=>{save.done={};save.records={};persist();map()}}])}
function journal(){stop();view='journal';app.innerHTML=`<div class="screen"><div class="card"><div class="eyebrow">יומן התגליות</div><h2>אוצרות שאספנו בדרך</h2><div class="report">${D.map((d,i)=>`<div class="reportItem"><strong>${d.icon} ${d.name}</strong>${save.done[i]?d.learn.map(l=>`<p style="font-size:16px;margin:8px 0">${l[1]}</p>`).join(''):'<span class="small">התגליות יישמרו כאן אחרי השלמת המשימה.</span>'}</div>`).join('')}</div><button class="primary wide" id="back">חזרה למפה</button></div></div>`;$('#back').onclick=map}
function sources(){dialog('המדע שמאחורי המסע',`התוכן נשען על מקורות של נאס"א. קישורי המקור באנגלית, להורים:<br><a href="https://www.nasa.gov/learning-resources/for-kids-and-students/what-is-earth-grades-k-4/" target="_blank" rel="noopener">יום ולילה</a><br><a href="https://spaceplace.nasa.gov/what-is-gravity/en/" target="_blank" rel="noopener">מהי כבידה?</a><br><a href="https://spaceplace.nasa.gov/all-about-the-moon/en/" target="_blank" rel="noopener">הירח</a><br><a href="https://science.nasa.gov/solar-system/solar-system-facts/" target="_blank" rel="noopener">מערכת השמש</a><br><a href="https://spaceplace.nasa.gov/all-about-mars/en/" target="_blank" rel="noopener">מאדים</a><br><a href="https://spaceplace.nasa.gov/all-about-saturn/en/" target="_blank" rel="noopener">שבתאי</a><br><a href="https://science.nasa.gov/jupiter/" target="_blank" rel="noopener">צדק</a><br><a href="https://science.nasa.gov/venus/" target="_blank" rel="noopener">נוגה</a><br><a href="https://science.nasa.gov/solar-system/comets/" target="_blank" rel="noopener">שביטים</a><br><a href="https://spaceplace.nasa.gov/what-powers-a-spacecraft/" target="_blank" rel="noopener">לוחות סולריים</a><br>הציורים, הרחפנים והקרבות הם דמיון. ההדגמות מפשטות את המציאות.`,[{label:'סגירה',fn:()=>modal.innerHTML=''}])}
