'use strict';
const $=s=>document.querySelector(s),app=$('#app'),modal=$('#modal');
const KEY='space-guardians.he.v1';let storeError=false;let save={done:{},records:{},sound:true};try{save={...save,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){storeError=true}function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){storeError=true}}
let view='map',mission=0,lesson=0,anim=0,labAnim=0,game=null,audio=null,muted=!save.sound;let pause=false,questionOpen=false;let session={wrong:0,first:0,answered:0};
function tone(freq=560,dur=.12,type='sine'){if(muted)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.09,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function speak(t){if(muted)return;if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='he-IL';u.rate=.86;const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('he'));if(v)u.voice=v;speechSynthesis.speak(u)}}
function stop(){cancelAnimationFrame(anim);cancelAnimationFrame(labAnim);if('speechSynthesis'in window)speechSynthesis.cancel();game=null;pause=false;questionOpen=false;modal.innerHTML='';window.scrollTo(0,0)}
$('#sound').onclick=()=>{muted=!muted;save.sound=!muted;persist();$('#sound').textContent=muted?'🔇':'🔊';if(muted&&'speechSynthesis'in window)speechSynthesis.cancel();else tone()};$('#sound').textContent=muted?'🔇':'🔊';$('#home').onclick=()=>map();$('#full').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){showInfo('מסך מלא','אפשר לשחק גם בלי מסך מלא. בדפדפן הזה הכפתור אינו זמין.')}};
const D=[
 {name:'כדור הארץ',sub:'לאן נעלמת השמש בלילה?',color:'#48b9d6',theme:'earth',icon:'🌍',enemy:'רחפן הצללים',learn:[['אור מצד אחד','השמש מאירה תמיד חצי מכדור הארץ. הצד שפונה אליה מואר: שם יום.','rotation'],['הארץ מסתובבת','כדור הארץ מסתובב סביב עצמו. כך המקום שבו אנחנו נמצאים עובר מיום ללילה. סיבוב שלם נמשך בערך יממה.','rotation'],['לא צריך לירות בחושך','רחפן הצללים התבלבל: הוא חושב שהשמש כבתה. נראה לו שהארץ פשוט הסתובבה!','rotation']],q:[['הרחפן אומר: השמש כבתה! מה באמת קרה?', [['🌍','הצד שלנו הסתובב מהשמש'],['💤','השמש הלכה לישון'],['🌧️','גשם כיבה את השמש']],0,'השמש ממשיכה להאיר. הצד שלנו פונה עכשיו ממנה והלאה.'],['בצד שפונה אל השמש יש...', [['🌙','לילה'],['☀️','יום'],['❄️','תמיד שלג']],1,'אור השמש מאיר את הצד שפונה אליה.'],['מה גורם ליום ולילה?', [['🌍','סיבוב הארץ סביב עצמה'],['🚀','טיסה של חללית'],['🌑','הירח מכבה את האור']],0,'הארץ מסתובבת סביב עצמה, ולכן האור מגיע בכל פעם לצד אחר.'],['כמה זמן נמשך בערך סיבוב של הארץ סביב עצמה?', [['⏱️','דקה'],['📅','יממה'],['🗓️','שנה']],1,'יממה היא יום ולילה יחד, בערך 24 שעות.'],['אצל חבר בצד השני של הארץ לילה. האם גם אצלך חייב להיות לילה?', [['✅','כן, בכל מקום אותו דבר'],['🌞','לא, צד אחר יכול להיות מואר'],['🚫','אי אפשר לדעת שום דבר']],1,'באותו זמן צד אחד מואר והצד השני חשוך.']]},
 {name:'הירח',sub:'קופצים גבוה, נוחתים לאט',color:'#b3b8d0',theme:'moon',icon:'🌕',enemy:'קפצון המכתשים',learn:[['כוח בלתי נראה','כבידה מושכת דברים זה אל זה. על הארץ היא מושכת אותנו לקרקע, וגם בירח יש כבידה.','jump'],['אותה קפיצה, עולם אחר','הכבידה על הירח חלשה יותר: בערך שישית מזו של הארץ. אותה קפיצה תגיע שם גבוה יותר.','jump'],['הירח לא מנורה','הירח אינו יוצר אור משלו. אנחנו רואים אור שמש שמוחזר ממנו, כמו אור ממראה.','light']],q:[['איפה אותה קפיצה תגיע גבוה יותר?', [['🌍','על כדור הארץ'],['🌕','על הירח'],['🧱','אין הבדל']],1,'על הירח הכבידה חלשה יותר, ולכן אותה דחיפה מרימה אותנו גבוה יותר.'],['קפצון אומר: בירח אין כבידה. הוא צודק?', [['🚫','לא, יש כבידה חלשה יותר'],['✅','כן, אין שום כבידה'],['💨','רק כשיש רוח']],0,'גם הירח מושך דברים לקרקע. אחרת הקפיצה לא היתה מסתיימת בנחיתה.'],['מאיפה מגיע האור שאנחנו רואים מהירח?', [['💡','מנורה בתוך הירח'],['☀️','אור שמש שמוחזר ממנו'],['🔥','מדורה על הירח']],1,'הירח מחזיר אור מהשמש. הוא לא כוכב שמייצר אור.'],['מה יקרה לכדור שמשחררים מעל פני הירח?', [['🎈','ייעלם למעלה'],['⬇️','ייפול לקרקע'],['🧊','יקפא במקום באוויר']],1,'כבידת הירח מושכת את הכדור למטה.'],['הגוף שלך השתנה כשעברת לירח?', [['🧍','לא. הכבידה שונה ולכן המשקל שונה'],['🐜','כן, נהיית קטן פי שישה'],['🪶','כן, הפכת לנוצה']],0,'כמות החומר בגוף נשארת זהה. המשקל משתנה כי כוח המשיכה שונה.']]},
 {name:'השמש',sub:'הכוכב שנותן לנו אור',color:'#ffb54c',theme:'sun',icon:'☀️',enemy:'גונב האנרגיה',learn:[['כוכב, לא כוכב לכת','השמש היא כוכב: כדור ענק ולוהט של גז. היא מייצרת אור וחום. כדור הארץ הוא כוכב לכת.','solar'],['אנרגיה מאור','לוח סולרי הופך אור לחשמל. כוונו את לוח החללית אל השמש כדי לטעון את המגן.','solar'],['רחוק ובטוח','לא נוחתים על השמש. היא חמה מדי ואין לה קרקע מוצקה כמו לארץ. בטיסה הזאת נשארים רחוק ממנה.','solar']],q:[['איזה גוף מייצר אור משלו?', [['🌕','הירח'],['🌍','כדור הארץ'],['☀️','השמש']],2,'השמש היא כוכב שמייצר אור וחום. הארץ והירח מחזירים אור.'],['לאן נכוון לוח סולרי כדי לקבל יותר אור?', [['☀️','אל השמש'],['🌑','אל החושך'],['🧳','לתוך תיק סגור']],0,'לוח סולרי זקוק לאור כדי לייצר חשמל.'],['גונב האנרגיה מציע לנחות על השמש. מה נעשה?', [['🛬','ננחת על אדמה קרירה'],['🛡️','נישאר רחוק ובטוח'],['🏊','נשחה בים שלה']],1,'השמש לוהטת ואין עליה קרקע מוצקה לנחיתה.'],['מה ההבדל בין השמש לכדור הארץ?', [['⭐','השמש כוכב. הארץ כוכב לכת'],['👯','אין שום הבדל'],['💡','הארץ מייצרת את אור השמש']],0,'כוכב כמו השמש מייצר אור. כוכב לכת כמו הארץ מקיף כוכב.'],['הלוח בצל ולא נטען. מה כדאי לשנות?', [['🔦','להעביר אותו למקום מואר'],['🧊','להוסיף קרח'],['🎵','להשמיע מוזיקה']],0,'אור הוא מקור האנרגיה של הלוח הסולרי.']]},

function map(){stop();view='map';const done=Object.keys(save.done).length;app.innerHTML=`<div class="wrap"><section class="hero"><div><div class="eyebrow">חוקרים • מנסים • מצילים</div><h1>הכוח הכי חזק?<br>לדעת איך החלל עובד.</h1><p>הרובוטים התבלבלו! צאו למסע, גלו את סודות החלל ועזרו להם בעזרת המדע.</p><button class="primary" id="continue">${done?'ממשיכים במסע ✦':'יוצאים להרפתקה 🚀'}</button></div>${art()}</section><div class="section"><h2>מפת המסע</h2><span class="pill">${done} מתוך 6 תגים</span></div><div class="grid">${D.map((d,i)=>`<button class="mission" data-m="${i}" ${i>0&&!save.done[i-1]?'disabled':''}><div class="orb" style="background:${d.color}"></div><div class="small">משימה ${i+1}</div><h3>${d.name}</h3><div class="small">${d.sub}</div><div class="status">${save.done[i]?'✦ הושלם! אפשר לשחק שוב':i===0||save.done[i-1]?'← מוכנים להמראה':'🔒 נפתח אחרי המשימה הקודמת'}</div></button>`).join('')}</div><div class="row"><button class="secondary" id="journal">📚 יומן התגליות</button><button class="secondary" id="parents">להורים • התקדמות ואיפוס</button></div><div class="foot">האיורים והמסלולים להמחשה, לא לפי קנה מידה. הרובוטים דמיוניים; המדע אמיתי.<br>${storeError?'⚠ הדפדפן לא מאפשר שמירה. ההתקדמות עלולה להימחק בסגירה.':'ההתקדמות נשמרת בדפדפן הזה בלבד, לא עוברת בין מכשירים.'}</div></div>`;$('#continue').onclick=()=>start(Math.min(D.findIndex((_,i)=>!save.done[i])<0?0:D.findIndex((_,i)=>!save.done[i]),5));document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>start(+b.dataset.m));$('#parents').onclick=parents;$('#journal').onclick=journal;}

השוואה.',rings:'מקרוב רואים הרבה חלקיקים נפרדים, לא רצפה אחת.'};$('#labHint').textContent=H[type]});$('#next').onclick=()=>{if(lesson<2){lesson++;learn()}else briefing()};drawLab(type);}
function setupCanvas(c){const rect=c.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,1.5);c.width=rect.width*dpr;c.height=rect.height*dpr;const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);return{x,w:rect.width,h:rect.height}}

function dialog(title,body,buttons){modal.innerHTML=`<div class="overlay"><section class="dialog" role="dialog" aria-modal="true"><h2>${title}</h2><p>${body}</p><div class="row">${buttons.map((b,i)=>`<button class="${i===0?'primary':'secondary'}" data-dialog="${i}">${b.label}</button>`).join('')}</div></section></div>`;buttons.forEach((b,i)=>modal.querySelector(`[data-dialog="${i}"]`).onclick=b.fn)}
function showInfo(t,b){dialog(t,b,[{label:'הבנתי',fn:()=>modal.innerHTML=''}])}
function parents(){stop();view='parents';app.innerHTML=`<div class="screen"><div class="card"><div class="eyebrow">מבט להורים</div><h2>מה הילד באמת הבין?</h2><p style="font-size:16px">כל משימה כוללת 3 תגליות, הדגמה אינטראקטיבית ו-5 שאלות. תג מתקבל רק אחרי שכל 5 השאלות נענו נכון, גם אם נדרשו רמזים. תשובה ראשונה מודדת הבנה לפני עזרה, לא רק השלמה.</p><div class="report">${D.map((d,i)=>{const r=save.records[i];return `<div class="reportItem"><strong>${d.icon} ${d.name}: ${save.done[i]?'הושלם':'עוד לא הושלם'}</strong><span class="small">${r?`בסיבוב האחרון: ${r.lastFirst}/5 בניסיון ראשון • ${r.wrong} ניסיונות תיקון<br>הכי טוב: ${r.first}/5 • סיבובים: ${r.attempts}`:'אין עדיין תוצאות. ההתקדמות נשמרת בסיום המשימה.'}</span></div>`}).join('')}</div><p style="font-size:16px">כדאי לשאול: "מה יקרה לאותה קפיצה בירח? למה?" או "למה אצלנו לילה ובמקום אחר יום?" בקשו הסבר במילים שלו.</p><div class="row"><button class="secondary" id="sources">מקורות המדע</button><button class="secondary" id="back">חזרה למפה</button></div><button class="secondary wide" style="border-color:#d58b9e;color:#ffbdca" id="reset">איפוס כל ההתקדמות במכשיר הזה</button><div class="foot">אין חשבון ואין איסוף מידע. הקול העברי משתמש בקולות המותקנים בדפדפן, אם זמינים; לכל הסבר יש גם טקסט והדגמה. ניתן להשתיק בכל עת. גדלים ומרחקים אינם בקנה מידה.</div></div></div>`;$('#back').onclick=map;$('#sources').onclick=sources;$('#reset').onclick=()=>dialog('לאפס את המסע?','כל התגים והתוצאות בדפדפן הזה יימחקו. אי אפשר לבטל.',[{label:'לא, משאירים',fn:()=>modal.innerHTML=''}, {label:'כן, לאפס הכל',fn:()=>{save.done={};save.records={};persist();map()}}])}
function journal(){stop();view='journal';app.innerHTML=`<div class="screen"><div class="card"><div class="eyebrow">יומן התגליות</div><h2>אוצרות שאספנו בדרך</h2><div class="report">${D.map((d,i)=>`<div class="reportItem"><strong>${d.icon} ${d.name}</strong>${save.done[i]?d.learn.map(l=>`<p style="font-size:16px;margin:8px 0">${l[1]}</p>`).join(''):'<span class="small">התגליות יישמרו כאן אחרי השלמת המשימה.</span>'}</div>`).join('')}</div><button class="primary wide" id="back">חזרה למפה</button></div></div>`;$('#back').onclick=map}
function sources(){dialog('המדע שמאחורי המסע',`התוכן נשען על מקורות של נאס"א. קישורי המקור באנגלית, להורים:<br><a href="https://www.nasa.gov/learning-resources/for-kids-and-students/what-is-earth-grades-k-4/" target="_blank" rel="noopener">יום ולילה</a><br><a href="https://spaceplace.nasa.gov/what-is-gravity/en/" target="_blank" rel="noopener">מהי כבידה?</a><br><a href="https://spaceplace.nasa.gov/all-about-the-moon/en/" target="_blank" rel="noopener">הירח</a><br><a href="https://science.nasa.gov/solar-system/solar-system-facts/" target="_blank" rel="noopener">מערכת השמש</a><br><a href="https://spaceplace.nasa.gov/all-about-mars/en/" target="_blank" rel="noopener">מאדים</a><br><a href="https://spaceplace.nasa.gov/all-about-saturn/en/" target="_blank" rel="noopener">שבתאי</a><br><a href="https://spaceplace.nasa.gov/what-powers-a-spacecraft/" target="_blank" rel="noopener">לוחות סולריים</a><br>הציורים, הרחפנים והקרבות הם דמיון. ההדגמות מפשטות את המציאות.`,[{label:'סגירה',fn:()=>modal.innerHTML=''}])}
map();
</script><script>if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sw.js")})};</script></body></html>
