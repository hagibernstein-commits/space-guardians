תֵר, אָז קוֹפְצִים גָּבוֹהַּ וְנוֹחֲתִים לְאַט.',light:'הָאוֹר מַגִּיעַ מֵהַשֶּׁמֶשׁ. הַיָּרֵחַ רַק מַחְזִיר אוֹתוֹ.',solar:labState.toggle?'הַלּוּחַ פּוֹנֶה אֶל הָאוֹר: טְעִינָה!':'הַלּוּחַ מֻפְנֶה הַצִּדָּה: פָּחוֹת אוֹר מַגִּיעַ אֵלָיו.',terrain:i===0?'יֵשׁ קַרְקַע סַלְעִית! הָרוֹבּוֹט יָכוֹל לִנְסֹעַ.':'עֲנַק גַּזִּים: אֵין רִצְפָּה מוּצָקָה לִנְחִיתָה כְּמוֹ בָּאָרֶץ.',orbit:i===0?'מְשִׁיכָה פְּנִימָה + תְּנוּעָה קָדִימָה = מַסְלוּל מְעֻקָּל.':'בְּלִי הַמְּשִׁיכָה, הַגּוּף הָיָה מַמְשִׁיךְ יָשָׁר. זֶה מוֹדֵל דִּמְיוֹנִי לְהַשְׁוָאָה.',rings:'מִקָּרוֹב רוֹאִים הַרְבֵּה חֶלְקִיקִים נִפְרָדִים, לֹא רִצְפָּה אַחַת.',storm:'הַכֶּתֶם הָאָדֹם הוּא סוּפָה - גְּדוֹלָה מִכַּדּוּר הָאָרֶץ כֻּלּוֹ!',heat:i===0?'בְּלִי שְׂמִיכַת אֲוִיר: הַחֹם בּוֹרֵחַ הַחוּצָה לֶחָלָל.':'עִם שְׂמִיכַת הָאֲוִיר הֶעָבֶה הַחוּם נִלְכָּד: נוּגָה הוֹפֶכֶת לַחְמָהּ בְּיוֹתֵר!',comet:'שִׂימוּ לֵב: הַזָּנָב תָּמִיד מַצְבִּיעַ הַרְחֵק מֵהַשֶּׁמֶשׁ, גַּם כְּשֶׁהַשָּׁבִיט טָס אָחוֹרָה!',cold:'כְּכָל שֶׁמַּרְחִיקִים מֵהַשֶּׁמֶשׁ - מַגִּיעַ פָּחוֹת חֹם.',tilt:'הַצִּיר שֶׁל אוּרָאנוּס שׁוֹכֵב עַל הַצַּד!',wind:'רוּחוֹת שֶׁל יוֹתֵר מֵ-2,000 קָמָ"שׁ - מַהֵר מִמְּטוֹס סִילוֹן!',dwarf:'מַשְׁוִים גְּדָלִים: אֶרֶץ, יָרֵחַ, וּפְּלוּטוֹ הַקָּטָן.',neighbors:'כּוֹכַב לֶכֶת גָּדוֹל מַפְנֶה אֶת סְבִיבָתוֹ; פְּלוּטוֹ - לֹא.',heart:'הַקֶּרַח זָז לְאַט מְאוֹד, כְּמוֹ נָהָר קָפוּא.',station:'נוֹפְלִים סְבִיב הָאָרֶץ - וּמַחְמִיצִים!',station2:'מוֹנִים זְרִיחוֹת בִּזְמַן שֶׁהַתַּחֲנָה מַקִּיפָה אֶת הָאָרֶץ.',drops:'הַטִּפּוֹת מִתְאַחֲדוֹת לְכַדּוּר אֶחָד גָּדוֹל.'};$('#labHint').textContent=H[type]||''});$('#next').onclick=()=>{if(lesson<2){lesson++;learn()}else briefing()};drawLab(type)}
function setupCanvas(c){const rect=c.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,1.5);c.width=rect.width*dpr;c.height=rect.height*dpr;const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);return{x,w:rect.width,h:rect.height}}
function circle(x,cx,cy,r,color){x.fillStyle=color;x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.fill()}
function text(x,t,xx,yy,size=17,color='#e6f2ff'){x.fillStyle=color;x.font=`bold ${size}px Arial`;x.textAlign='center';x.direction='rtl';x.fillText(t,xx,yy)}
function planet(x,cx,cy,r,color,kind='earth'){x.save();let gr=x.createRadialGradient(cx-r*.35,cy-r*.4,1,cx,cy,r);gr.addColorStop(0,color);gr.addColorStop(.7,color);gr.addColorStop(1,'#15213d');circle(x,cx,cy,r,gr);x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.clip();if(kind==='earth'){x.fillStyle='#64c0a0';x.beginPath();x.ellipse(cx-r*.25,cy-r*.22,r*.38,r*.6,.8,0,7);x.fill();x.beginPath();x.ellipse(cx+r*.42,cy+r*.35,r*.5,r*.26,-.7,0,7);x.fill()}if(kind==='moon'||kind==='mars'){for(let i=0;i<7;i++)circle(x,cx+Math.sin(i*3)*r*.66,cy+Math.cos(i*2)*r*.61,r*(.06+i*.009),'#0002')}if(kind==='saturn'){for(let i=-3;i<4;i++){x.strokeStyle='#785d5233';x.lineWidth=6;x.beginPath();x.moveTo(cx-r,cy+i*r/4);x.lineTo(cx+r,cy+i*r/4);x.stroke()}}if(kind==='jupiter'){const bands=['#e8cda0','#b97f56','#ecd9b8','#a9714b','#e2c298'];bands.forEach((c,i)=>{x.fillStyle=c;x.fillRect(cx-r,cy-r+i*r*2/5,r*2,r*2/5+1)});x.fillStyle='#c65b4e';x.beginPath();x.ellipse(cx+r*.3,cy+r*.25,r*.32,r*.16,-.2,0,7);x.fill()}if(kind==='venus'){x.fillStyle='#f3d98e55';for(let i=0;i<4;i++){x.beginPath();x.ellipse(cx,cy-r*.5+i*r*.33,r,r*.14,.35,0,7);x.fill()}}if(kind==='comet'){for(let i=0;i<6;i++)circle(x,cx+Math.sin(i*3)*r*.6,cy+Math.cos(i*2)*r*.6,r*.09,'#e8f7fc')}x.restore();if(kind==='saturn'){x.save();x.translate(cx,cy);x.rotate(-.3);x.strokeStyle='#d7bd97aa';x.lineWidth=r*.18;x.beginPath();x.ellipse(0,0,r*1.65,r*.35,0,0,Math.PI*2);x.stroke();x.restore()}}
function ship(x,px,py,s=1){x.save();x.translate(px,py);x.scale(s,s);x.fillStyle='#4ee6e0';x.beginPath();x.moveTo(-8,20);x.lineTo(0,35+Math.random()*8);x.lineTo(8,20);x.fill();x.fillStyle='#ecf4ff';x.beginPath();x.moveTo(0,-24);x.quadraticCurveTo(22,-5,16,21);x.lineTo(-16,21);x.quadraticCurveTo(-22,-5,0,-24);x.fill();x.fillStyle='#f2b955';x.beginPath();x.moveTo(-15,6);x.lineTo(-26,25);x.lineTo(-12,20);x.moveTo(15,6);x.lineTo(26,25);x.lineTo(12,20);x.fill();circle(x,0,-2,9,'#41a7ca');circle(x,-2,-5,3,'#b0edff');x.restore()}
function robot(x,px,py,r,kind,shield=true){x.save();x.translate(px,py);if(shield){x.strokeStyle='#70dcf4aa';x.lineWidth=2;x.beginPath();x.arc(0,0,r+8,0,7);x.stroke()}let cols=['#b390ed','#f2b66a','#f17d8e','#8cb8e8','#a5b57f','#ddb887','#7fd4e8','#e8a3c0','#b8e07f','#7fc4e8','#d9b48f','#9fb7d9'];x.fillStyle=cols[kind];x.beginPath();x.roundRect(-r*.8,-r*.65,r*1.6,r*1.25,kind===2?r:8);x.fill();x.strokeStyle=cols[kind];x.lineWidth=4;x.beginPath();x.moveTo(-r*.7,0);x.lineTo(-r*1.2,r*.3);x.moveTo(r*.7,0);x.lineTo(r*1.2,r*.3);x.moveTo(0,-r*.6);x.lineTo(0,-r);x.stroke();circle(x,0,-r,3,'#74f0ec');x.fillStyle='#183553';x.fillRect(-r*.6,-r*.3,r*1.2,r*.45);circle(x,-r*.3,-r*.1,3,'#9afcf3');circle(x,r*.3,-r*.1,3,'#9afcf3');x.strokeStyle='#243d58';x.lineWidth=2;x.beginPath();x.arc(0,r*.25,r*.21,0,Math.PI);x.stroke();x.restore()}
function drawLab(type){const {x,w,h}=setupCanvas($('#lab'));let prev=0,t=0;function frame(now){let dt=Math.min((now-prev)/1000||0,.04);prev=now;t+=dt;x.clearRect(0,0,w,h);for(let i=0;i<24;i++)circle(x,(i*73)%w,(i*47)%h,1,'#91b7e944');let mid=w/2;
